[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tab-organizer-companion"
version = "0.2.0.dev0"
description = "Independent local Sign in with ChatGPT companion for AI Tab Organizer"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyJWT[crypto]>=2.10.1,<3", "keyring>=25.6,<26"]

[project.scripts]
ai-tab-companion = "ai_tab_companion.cli:main"

[tool.setuptools.packages.find]
include = ["ai_tab_companion*"]
